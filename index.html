<html>
	<head>
		<style>
			button {
				display: block;
				color: #fff;
				background-color: #07f;
				padding: 10px 20px;
				border: none;
				border-radius: 5px;
				cursor: pointer;
				white-space: nowrap;
				text-overflow: ellipsis;
				overflow: hidden;
				width: 100%;
			}
			button[disabled] {
				opacity: .5;
				cursor: not-allowed;
			}

			body {
				font-family: system-ui, -apple-system;
				width: 200px;
				padding: 20px;
			}
			body > * {
				display: none;
			}
			body.unsupported #unsupported-container {
				display: block;
			}
			body.error #error-container {
				display: block;
			}
			body.ready #download-button {
				display: block;
			}
			body.downloading #status-container {
				display: block;
			}
			body.success #success-container {
				display: block;
			}

			progress {
				width: 100%;
			}

			#error-container {
				color: #d23;
			}

			@media (prefers-color-scheme: dark) {
				body {
					background-color: #212121;
					color: #fff;
				}
			}
		</style>
	</head>

	<body>
		<div id='unsupported-container'>This page is not a Google Drive document</div>
		
		<div id='error-container'></div>

		<button id='download-button'>Download <span id='fname'></span></button>

		<div id='status-container'>
			<progress id='progress-bar' max='1'></progress>
			<p id='status-text'>Getting document data...</p>
		</div>

		<div id='success-container'>
			<p>Download complete!</p>
		</div>
	</body>

	<script src='pdf-lib.min.js'></script>
	<script src='script.js'></script>
</html>
